name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    name: yarn build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Setup Yarn
        run: |
          yarn set version stable --yarn-path
          yarn install --immutable
      
      - name: Build
        run: yarn build
