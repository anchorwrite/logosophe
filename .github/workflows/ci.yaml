name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    name: yarn build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Setup Yarn
        run: |
          corepack prepare yarn@4.9.4 --activate
          yarn --version
          yarn install --immutable
      
      - name: Build
        run: yarn build
